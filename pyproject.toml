[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sqlite-graph-memory"
version = "0.3.9"
description = "Associative memory for LLM agents: Graph RAG over a folder of markdown notes, in one SQLite file, with no server to run."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Anton Dziatkovskii" },
  { name = "Vardhman Gupta" },
]
keywords = [
  "graph-rag",
  "agent-memory",
  "llm-memory",
  "retrieval",
  "sqlite",
  "rag",
  "obsidian",
  "wikilinks",
  "second-brain",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The same two models on ONNX Runtime, no torch: ~60 MB instead of ~2 GB, and a recall
# that starts in seconds on a CPU laptop. Measured 2026-11-01 through the MCP server on
# Windows: `import torch` alone took 44 s and the client hit its 60 s tool timeout.
# brain_ask picks this stack automatically when it is installed (SGM_BACKEND overrides).
lite = [
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface_hub>=0.20",
]
# The indexer and the reranker need these; the graph half, the SQLite schema and
# the turnstate memory do not. Kept out of the base install so that
# `pip install sqlite-graph-memory` stays a two-second, ~20 MB operation instead
# of pulling ~2 GB of torch on a machine that only wants to read the graph.
# Intel Macs top out at torch 2.2.x, which is built against NumPy 1.x and dies on
# NumPy 2 with "RuntimeError: Numpy is not available" (measured 2026-10-15 on an
# x86_64 Mac, Python 3.9: sgm-index crashed; with numpy<2 it indexed cleanly).
# The same ceiling bites one layer up: transformers 5.x needs torch >= 2.6, so on
# torch 2.2 it disables torch and sgm-index dies with "NameError: name 'nn' is not
# defined" inside transformers/integrations/accelerate.py (measured 2026-10-15 on
# an x86_64 Mac, Python 3.12, fresh `pip install` from PyPI). sentence-transformers
# 6.x in turn requires transformers 5.x, so both are capped there.
embeddings = [
  "sentence-transformers>=2.6",
  "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers<4.50; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sentence-transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/tonydzi/sqlite-graph-memory"
Repository = "https://github.com/tonydzi/sqlite-graph-memory"
Changelog = "https://github.com/tonydzi/sqlite-graph-memory/blob/main/CHANGELOG.md"
Issues = "https://github.com/tonydzi/sqlite-graph-memory/issues"

[project.scripts]
sgm-index = "sqlite_graph_memory.index_notes:main"
sgm-ask = "sqlite_graph_memory.brain_ask:main"
sgm-stats = "sqlite_graph_memory.vault_stats:main"
sgm-turnstate-hook = "sqlite_graph_memory.turnstate_hook:main"
sgm-turnstate-show = "sqlite_graph_memory.turnstate_show:main"
sgm-mcp = "sqlite_graph_memory.mcp_server:main"
sgm-doctor = "sqlite_graph_memory.doctor:main"
# Same server under the package's own name, so `uvx sqlite-graph-memory` (what MCP
# registry clients run for a PyPI package) starts it without a --from flag.
sqlite-graph-memory = "sqlite_graph_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_graph_memory"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sqlite_graph_memory",
  "tests",
  "eval",
  "examples",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "CITATION.cff",
  "requirements.txt",
]
