name: bench

# Two gates for bench/:
#   validate   stdlib only, seconds. Every result file must follow from its own
#              per-question outputs, match this vault, and the leaderboard must be
#              exactly what leaderboard.py generates. Forgeries are proved to fail
#              (--selftest), and the no-model BM25 row is rerun and must match exactly.
#   reproduce  downloads the two models and reruns sqlite-graph-memory on CPU from a
#              clean index. The committed baseline must come out the same.

on:
  push:
    branches: [main]
    paths: ['bench/**', 'src/**', '.github/workflows/bench.yml']
  pull_request:
    paths: ['bench/**', 'src/**', '.github/workflows/bench.yml']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: result files, vault and leaderboard are consistent
        run: python bench/validate.py
      - name: the gate rejects forged results
        run: python bench/validate.py --selftest
      - name: the BM25 row reproduces exactly
        run: python bench/validate.py --reproduce bm25 --tolerance 0

  reproduce:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5base-mmarco-v1
      - name: install the CPU stack the baseline was produced with
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r bench/requirements.txt
      - name: every system in bench/ci_reproduced.txt reproduces
        # the same list decides the "CI-reproduced: yes" column, so the badge and the
        # rerun can never disagree. BM25 is rerun exactly in the validate job.
        run: |
          set -e
          for s in $(grep -v '^#' bench/ci_reproduced.txt | grep -v '^bm25$'); do
            python bench/validate.py --reproduce "$s" --tolerance 0.02
          done
