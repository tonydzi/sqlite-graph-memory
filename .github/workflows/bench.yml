name: bench

# Two gates for bench/:
#   validate   stdlib only, seconds. Every result file must follow from its own
#              per-question outputs, match this vault, and the leaderboard must be
#              exactly what leaderboard.py generates. Forgeries are proved to fail
#              (--selftest), and the no-model BM25 row is rerun and must match exactly.
#   reproduce  downloads the two models and reruns sqlite-graph-memory on CPU from a
#              clean index. The committed baseline must come out the same. Systems that
#              need a local Ollama (marked `needs: ollama` in ci_reproduced.txt) rerun
#              against a pinned Ollama container restricted to one CPU kernel, from their
#              own venv.

on:
  push:
    branches: [main]
    paths: ['bench/**', 'src/**', '.github/workflows/bench.yml']
  pull_request:
    paths: ['bench/**', 'src/**', '.github/workflows/bench.yml']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: result files, vault and leaderboard are consistent
        run: python bench/validate.py
      - name: the gate rejects forged results
        run: python bench/validate.py --selftest
      - name: the BM25 row reproduces exactly
        run: python bench/validate.py --reproduce bm25 --tolerance 0

  reproduce:
    runs-on: ubuntu-latest
    needs: validate
    env:
      MEM0_TELEMETRY: 'false'
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5base-mmarco-v1
      - name: install the CPU stack the baseline was produced with
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r bench/requirements.txt
      - name: install the Ollama adapters (own venv) and pull the pinned embedding model
        run: |
          set -e
          python -m venv /tmp/venv-ollama
          /tmp/venv-ollama/bin/python -m pip install --upgrade pip
          /tmp/venv-ollama/bin/python -m pip install -r bench/requirements-ollama.txt
          # Ollama pinned by digest, and with ONE CPU kernel. Left alone it picks the kernel by
          # the runner's CPU (zen4 on one run, haswell on the next), and the two round the
          # scores differently in the 4th decimal: 3-12 of 91 rankings moved between runs.
          # haswell (AVX2) runs on every GitHub runner, so every run computes the same floats.
          docker run -d --name ollama -p 11434:11434 --entrypoint /bin/sh \
            ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6 \
            -c 'cd /usr/lib/ollama && for f in libggml-cpu-*.so; do [ "$f" = libggml-cpu-haswell.so ] || rm -f "$f"; done; ls libggml-cpu-*.so; exec /bin/ollama serve'
          # wait up to 60 s for it to listen, then fail loudly
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          curl -sf http://localhost:11434/api/version
          curl -sf http://localhost:11434/api/pull -d '{"model":"nomic-embed-text:latest","stream":false}'
          # exactly this tag, exactly the digest the committed results were produced with
          curl -sf http://localhost:11434/api/tags | python -c "import sys,json; t=json.load(sys.stdin)['models']; d=[m['digest'] for m in t if m['name']=='nomic-embed-text:latest']; print(d); sys.exit(0 if d==['0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f'] else 1)"
          # load the model once and prove which kernel computed it
          curl -sf http://localhost:11434/api/embed -d '{"model":"nomic-embed-text:latest","input":["warm up"]}' > /dev/null
          docker logs ollama 2>&1 | grep 'loaded CPU backend'
          test "$(docker logs ollama 2>&1 | grep 'loaded CPU backend' | grep -vc 'libggml-cpu-haswell.so')" = 0
          docker logs ollama 2>&1 | grep -q 'loaded CPU backend from /usr/lib/ollama/libggml-cpu-haswell.so'
      - name: every system in bench/ci_reproduced.txt reproduces
        # the same list decides the "CI-reproduced: yes" column, so the badge and the
        # rerun can never disagree. BM25 is rerun exactly in the validate job.
        run: |
          set -e
          # read the list with the same parser the badge uses (bench_core.ci_reproduced).
          # Assigned first: a failing $(...) inside `for` would NOT trip set -e, and the job
          # would go green having rerun nothing.
          list=$(python -c "import sys; sys.path.insert(0, 'bench'); import bench_core as b; print(' '.join(sorted(b.ci_reproduced() - {'bm25'})))")
          test -n "$list" || { echo "::error::no neural system listed in bench/ci_reproduced.txt"; exit 1; }
          # systems whose line in ci_reproduced.txt says `needs: ollama` run from the Ollama venv
          ollama_list=$(python bench/ci_needs.py ollama)
          n=0; failed=""
          for s in $list; do
            py=python
            case " $ollama_list " in *" $s "*) py=/tmp/venv-ollama/bin/python ;; esac
            # every system runs even after a failure, so one red row does not hide the others
            $py bench/validate.py --reproduce "$s" --tolerance 0.02 || failed="$failed $s"
            n=$((n+1))
          done
          echo "reran $n system(s): $list"
          test -z "$failed" || { echo "::error::did not reproduce:$failed"; exit 1; }
        env:
          BENCH_KEEP_RERUNS: ${{ runner.temp }}/reruns
      - name: keep the reruns for diffing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-reruns
          path: ${{ runner.temp }}/reruns
          if-no-files-found: ignore
