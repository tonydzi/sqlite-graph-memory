# Publish to PyPI on every published GitHub release.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere, not in a
# repository secret and not on a laptop. PyPI verifies the workflow's identity
# directly.
#
# ONE-TIME SETUP, on the PyPI side, before the first release:
#   https://pypi.org/manage/account/publishing/
#   owner       tonydzi
#   repository  sqlite-graph-memory
#   workflow    publish.yml
#   environment pypi
# Skip it and this job fails with `invalid-publisher` while still reporting a
# valid OIDC token — that exact failure already cost us a release on
# secondop-panel v0.1.1 (2026-08-29), where the workflow was committed and the
# PyPI side was never registered, so the package sat at 404 while the release
# notes claimed it was published.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The wheel must be installable before it is publishable
        # Same check as the `installable` job in tests.yml, repeated here because
        # a release is the last moment anyone can still stop a broken wheel.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          for cmd in sgm-index sgm-ask sgm-mcp sgm-turnstate-hook sgm-turnstate-show; do
            test -x "/tmp/clean/bin/$cmd" || { echo "::error::$cmd missing from wheel"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
