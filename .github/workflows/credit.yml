name: credit

# CONTRIBUTING promises every outside merge a CHANGELOG line by GitHub handle.
# This job keeps the promise: stdlib only, one API read, seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: the gate itself goes red when it should
        run: python scripts/credit_gate.py --selftest
      - name: every outside merge is credited, every handle exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/credit_gate.py --since 2026-10-19
