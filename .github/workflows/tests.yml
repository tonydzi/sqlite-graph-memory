name: tests

# The suite needs no model download and no network: sentence-transformers is
# imported lazily, inside the functions that actually embed. So CI installs
# numpy and pytest, nothing else, and finishes in seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python says >=3.9, so the floor is tested, not just claimed:
        # the system Python on macOS is 3.9 and that is the machine this pilot
        # runs on daily. A floor nobody runs is a promise, not a fact.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # tests/test_changelog_released.py reads CHANGELOG.md at every version tag;
          # a shallow checkout has no tags and the guard would be blind.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: python -m pip install --upgrade pip numpy pytest
      - name: pytest
        run: python -m pytest tests -q
      - name: the ruler must break when broken
        # EVAL_MUTANT=1 sabotages nDCG on purpose. If the eval suite stays green
        # under it, the suite never tested the metric, and that is a CI failure.
        run: |
          if EVAL_MUTANT=1 python -m pytest tests/test_eval.py -q > /dev/null 2>&1; then
            echo "::error::EVAL_MUTANT=1 left the eval suite green - the metric is not under test"
            exit 1
          fi
          echo "EVAL_MUTANT=1 went red, as it must"

  installable:
    # `pip install sqlite-graph-memory` is the only door most people will ever
    # use, and it can break without a single test failing — a bad entry point,
    # a file left out of the wheel, a dependency that only exists on the author's
    # machine. This job installs the built wheel into a venv that has nothing
    # else in it and checks that the four commands actually start.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: the metadata PyPI will see must be valid
        run: python -m twine check dist/*
      - name: install the wheel into a pristine venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: every advertised command must start
        run: |
          for cmd in sgm-index sgm-ask sgm-mcp sgm-turnstate-hook sgm-turnstate-show sqlite-graph-memory; do
            test -x "/tmp/clean/bin/$cmd" || { echo "::error::$cmd was not installed"; exit 1; }
          done
          /tmp/clean/bin/sgm-turnstate-show --help > /dev/null
          echo "all four entry points present and startable"
      - name: package data must travel with the wheel
        # schema.sql is the database contract; a wheel without it installs fine
        # and then fails the first time someone creates the database.
        run: |
          /tmp/clean/bin/python -c "from importlib.resources import files; \
            assert (files('sqlite_graph_memory')/'schema.sql').read_text().strip(), 'schema.sql missing from wheel'; \
            print('schema.sql present')"
      - name: a base install must explain the missing extra, not traceback
        # The base install deliberately omits torch, so this is the normal first
        # run for most people. It must end in instructions, not a stack trace.
        run: |
          mkdir -p /tmp/notes
          printf '# A\n\nA note long enough to survive chunking, linking to [[B]].\n' > /tmp/notes/a.md
          out=$(/tmp/clean/bin/sgm-index /tmp/notes 2>&1 || true)
          echo "$out"
          case "$out" in
            *"sqlite-graph-memory[embeddings]"*) echo "base install explains itself" ;;
            *) echo "::error::base install did not name the embeddings extra"; exit 1 ;;
          esac
          case "$out" in
            *Traceback*) echo "::error::base install printed a traceback"; exit 1 ;;
          esac
      - name: the installed server must find an index relative to the user's directory
        # The tests run from the source tree, and the steps above only check that
        # the commands start. Neither reproduces how people actually launch the MCP
        # server: from their OWN directory, with a relative BRAIN_INDEX_DIR, against
        # the installed wheel. The recall child used to run with cwd set to the
        # package directory inside site-packages, so "index" resolved there and the
        # user's index was never found. CI stayed green on exactly that bug, so this
        # step reproduces it: a minimal index in /tmp/userdir, launch from there.
        # Index found => brain_ask gets past loading and stops at the missing
        # [embeddings] extra. Index NOT found => "need an embedding index".
        run: |
          mkdir -p /tmp/userdir/index
          cd /tmp/userdir
          /tmp/clean/bin/python -c "import numpy as np, pickle; np.save('index/_brain_e5.npy', np.zeros((1, 4), dtype='float32')); pickle.dump([{'path': 'a.md', 'chunk_idx': 0}], open('index/_brain_e5_meta.pkl', 'wb'))"
          out=$(env -u PYTHONPATH BRAIN_INDEX_DIR=index /tmp/clean/bin/sgm-mcp --test "agent memory" 2>&1 || true)
          echo "$out"
          case "$out" in
            *"need an embedding index"*) echo "::error::installed server looked for the index outside the user's directory"; exit 1 ;;
          esac
          case "$out" in
            *"sqlite-graph-memory[embeddings]"*) echo "index found from the user's directory" ;;
            *) echo "::error::unexpected output from the installed server"; exit 1 ;;
          esac
