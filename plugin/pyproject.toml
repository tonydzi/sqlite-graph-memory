# Locked runtime for the Claude Code plugin. The plugin directory requires the Python
# package to be pinned; uv.lock pins sqlite-graph-memory[lite] and every dependency by hash.
[project]
name = "sqlite-graph-memory-plugin-env"
version = "0.3.8"
requires-python = ">=3.10,<3.13"
dependencies = ["sqlite-graph-memory[lite]==0.3.8"]

[tool.uv]
package = false
# onnxruntime dropped Intel-Mac wheels in newer releases; make the lock pick a
# version that installs on every platform below (each gets its own resolution).
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
